[package]
name = "rustylib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "rustylib"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28.0", features = [ "cli" ] }
rust-ipfs = { path = "../..", default-features = false, features = ["tcp", "dns", "ed25519", "secp256k1", "ecdsa", "noise"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
serde_json = "1"

[build-dependencies]
uniffi = { version = "0.28.0", features = [ "build" ] }
